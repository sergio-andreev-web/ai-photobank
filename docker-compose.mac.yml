# Override compose for macOS development with native AI service (§8, §58).
# Usage: docker-compose -f docker-compose.yml -f docker-compose.mac.yml up
#
# Run the AI service itself with `make ai-mac` (MPS) or `make ai-mac-cpu`
# (CPU fallback, dev/smoke only) — not part of this Compose file, since it
# runs natively on the host for GPU access, not in a container. See
# infra/README.md "macOS with MPS" and services/ai/README.md.
#
# AI_SERVICE_API_KEY is not overridden here: `api`/`api-worker` already read
# it from the project-root .env in the base file, and `make ai-mac` sources
# the same .env for the native process, so both sides stay in sync (§63).

# The native service runs the real SigLIP2 weights, so semantic search must activate their
# vectors (ADR-0009), not the mock-embedding default of .env.example: model key without the
# org prefix, version = the pinned EMBEDDING_MODEL_REVISION the service reports.
x-real-embedding: &real-embedding
  EMBEDDING_ACTIVE_MODEL_KEY: siglip2-so400m-patch14-384
  EMBEDDING_ACTIVE_MODEL_VERSION: "${EMBEDDING_MODEL_REVISION}"

services:
  api:
    environment:
      AI_BASE_URL: http://host.docker.internal:8001
      <<: *real-embedding

  # Processing stages (images.ai / images.reprocess queues) run in
  # api-worker, not api — without this override the worker keeps the base
  # file's AI_BASE_URL (the ai-cpu container, which this overlay never
  # starts), so images would never reach the native AI service.
  api-worker:
    environment:
      AI_BASE_URL: http://host.docker.internal:8001
      <<: *real-embedding

  admin:
    environment:
      # Same value as the base file: this overlay only relocates the AI
      # backend to the host, not how the browser reaches nginx/the API.
      # A previous "http://localhost" here (missing the /api path) broke
      # every admin API call except the one explicit root override in
      # apps/admin/stores/auth.ts (GET /sanctum/csrf-cookie) — useApi's
      # axios instance appends request paths like "/admin/images" straight
      # onto this base URL.
      NUXT_PUBLIC_API_BASE: "/api"

  # ai-cpu stays disabled by its `ai` profile in the base Compose file.
