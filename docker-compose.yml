services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: photobank-postgres
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photobank

  redis:
    image: redis:7-alpine
    container_name: photobank-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photobank

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: photobank-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photobank

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: photobank-api
    environment:
      APP_ENV: "${APP_ENV}"
      APP_URL: "${APP_URL}"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      # Compose's rabbitmq service is the only broker in this stack, so the
      # queue connection is fixed here, not left to the app's own .env
      # default (config/queue.php 'database') — see apps/api/config/queue.php.
      QUEUE_CONNECTION: rabbitmq
      # Cache (queue restart signal, login throttle) and sessions live in the stack's Redis
      # through predis (composer.json): the image has no phpredis extension, and the
      # database drivers would need migrations before the worker can even start.
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      APP_KEY: "${APP_KEY}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      PHOTO_STORAGE_DISK: "${PHOTO_STORAGE_DISK}"
      PHOTO_STORAGE_ROOT: "${PHOTO_STORAGE_ROOT}"
      AI_BASE_URL: "${AI_BASE_URL}"
      AI_SERVICE_API_KEY: "${AI_SERVICE_API_KEY}"
      AI_REQUEST_TIMEOUT: "${AI_REQUEST_TIMEOUT}"
      # ADR-0009: only embeddings of this model_key + model_version become
      # active for semantic search (apps/api/config — see .env.example).
      EMBEDDING_ACTIVE_MODEL_KEY: "${EMBEDDING_ACTIVE_MODEL_KEY}"
      EMBEDDING_ACTIVE_MODEL_VERSION: "${EMBEDDING_ACTIVE_MODEL_VERSION}"
      TAG_AUTO_ATTACH_THRESHOLD: "${TAG_AUTO_ATTACH_THRESHOLD}"
      TAG_CANDIDATE_THRESHOLD: "${TAG_CANDIDATE_THRESHOLD}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # No source bind mount here: the built image already has vendor/
    # installed, and mounting ./apps/api over /app on a clean checkout (no
    # vendor/ on the host) would erase it, breaking the container. For local
    # source editing, add docker-compose.dev.yml on top of this file.
    volumes:
      - photobank_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - photobank

  api-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: photobank-api-worker
    environment:
      APP_ENV: "${APP_ENV}"
      APP_URL: "${APP_URL}"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      QUEUE_CONNECTION: rabbitmq
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      APP_KEY: "${APP_KEY}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      PHOTO_STORAGE_DISK: "${PHOTO_STORAGE_DISK}"
      PHOTO_STORAGE_ROOT: "${PHOTO_STORAGE_ROOT}"
      AI_BASE_URL: "${AI_BASE_URL}"
      AI_SERVICE_API_KEY: "${AI_SERVICE_API_KEY}"
      AI_REQUEST_TIMEOUT: "${AI_REQUEST_TIMEOUT}"
      EMBEDDING_ACTIVE_MODEL_KEY: "${EMBEDDING_ACTIVE_MODEL_KEY}"
      EMBEDDING_ACTIVE_MODEL_VERSION: "${EMBEDDING_ACTIVE_MODEL_VERSION}"
      TAG_AUTO_ATTACH_THRESHOLD: "${TAG_AUTO_ATTACH_THRESHOLD}"
      TAG_CANDIDATE_THRESHOLD: "${TAG_CANDIDATE_THRESHOLD}"
    # Must consume all three logical queues (config/photobank.php) — a plain
    # `queue:work rabbitmq` only drains its connection default
    # (images.processing) and would strand images.ai/images.reprocess jobs.
    # --timeout must stay greater than AI_REQUEST_TIMEOUT (an AI-stage job
    # blocks on a single HTTP call for up to that long): default
    # AI_REQUEST_TIMEOUT=300s, so QUEUE_WORKER_TIMEOUT defaults to 360s.
    command: >
      php artisan queue:work rabbitmq
      --queue=images.reprocess,images.ai,images.processing
      --sleep=3 --tries=3 --max-time=3600
      --timeout=${QUEUE_WORKER_TIMEOUT:-360}
    # The api image inherits FrankenPHP's HEALTHCHECK (Caddy admin :2019), which a queue
    # worker never serves; without this the worker always reports unhealthy.
    healthcheck:
      disable: true
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - api
    volumes:
      - photobank_storage:/app/storage
    networks:
      - photobank

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: photobank-admin
    environment:
      NUXT_PUBLIC_API_BASE: "/api"
    depends_on:
      - api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - photobank

  nginx:
    image: nginx:alpine
    container_name: photobank-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - photobank_storage:/var/www/photobank/storage:ro
    depends_on:
      - api
      - admin
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves localhost to ::1 first, and nginx
      # listens on IPv4 only, so the probe would never reach it.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - photobank

  ai-cpu:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
      args:
        DEVICE: cpu
    container_name: photobank-ai-cpu
    environment:
      DEVICE: cpu
      # This base file is for development and contract testing (production AI runs on
      # RunPod with a key), so an empty AI_SERVICE_API_KEY must stay allowed here:
      # the image defaults to AI_ENVIRONMENT=production, which refuses it (ADR-0010).
      AI_ENVIRONMENT: development
      VISION_MODEL: "${VISION_MODEL}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      EMBEDDING_MODEL_REVISION: "${EMBEDDING_MODEL_REVISION}"
      HF_HOME: /models
      PROMPT_VERSION: "${PROMPT_VERSION}"
      AI_SERVICE_API_KEY: "${AI_SERVICE_API_KEY}"
    ports:
      - "8001:8000"
    volumes:
      - ai_models_cache:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - ai
    networks:
      - photobank

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  photobank_storage:
  ai_models_cache:

networks:
  photobank:
    driver: bridge
