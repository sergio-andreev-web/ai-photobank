name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: photobank_test
          POSTGRES_USER: photobank
          POSTGRES_PASSWORD: photobank_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          cp .env.example .env
          sed -i 's/localhost/127.0.0.1/g' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=photobank_test/' .env

      - name: Validate Contracts
        run: |
          cd contracts
          python3 -m pip install -q -r requirements-validation.txt
          python3 tools/validate_contracts.py

  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint < apps/api/Dockerfile || true
          docker run --rm -i hadolint/hadolint < apps/admin/Dockerfile || true
          docker run --rm -i hadolint/hadolint < services/ai/Dockerfile || true
        continue-on-error: true

      - name: Validate YAML
        run: |
          for file in docker-compose*.yml; do
            docker-compose -f "$file" config > /dev/null || exit 1
          done
        continue-on-error: true

  backend-tests-sqlite:
    name: Backend Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo, pdo_pgsql, pdo_sqlite, sockets, sqlite3, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit (SQLite, per phpunit.xml)
        working-directory: apps/api
        run: vendor/bin/phpunit

  backend-tests-pgsql:
    name: Backend Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: photobank_test
          POSTGRES_USER: photobank
          POSTGRES_PASSWORD: photobank_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo, pdo_pgsql, pdo_sqlite, sockets, sqlite3, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      # phpunit.xml pins DB_CONNECTION=sqlite for local runs, but its <env>
      # entries have no force="true", so PHPUnit keeps variables already set
      # in the environment — the step env below retargets the suite at the
      # pgvector service container.
      - name: Run PHPUnit (PostgreSQL)
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: photobank_test
          DB_USERNAME: photobank
          DB_PASSWORD: photobank_test
        run: vendor/bin/phpunit

  ai-tests:
    name: AI Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/ai
        run: pip install -r requirements-dev.txt

      # Model-backed integration tests are opt-in (pytest.ini addopts already
      # defaults to "-m not model"); pass it explicitly so CI never depends on
      # GPU/network model weights (ТЗ §73).
      - name: Run pytest
        working-directory: services/ai
        run: pytest -m "not model"

  admin-tests:
    name: Admin Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Run unit tests (Vitest)
        working-directory: apps/admin
        run: npx vitest run

      - name: Build (Nuxt)
        working-directory: apps/admin
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/admin/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: apps/admin
        run: npx playwright install --with-deps chromium

      # e2e specs mock the API via Playwright route interception (tests/e2e/helpers.ts),
      # so no backend/AI service is started here.
      - name: Run e2e tests (Playwright, chromium)
        working-directory: apps/admin
        run: npx playwright test --project=chromium

  # Full docker-compose stack smoke test. Kept informational/non-blocking:
  # apps/api/Dockerfile and apps/admin/Dockerfile do not exist in this repo
  # yet, so `docker-compose build` cannot succeed today. Module test jobs
  # above (backend-tests-*, ai-tests, admin-tests) are the enforced gate;
  # this job reports status but never fails the workflow.
  integration:
    name: Integration Smoke (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker-compose build --no-cache

      - name: Start services
        run: |
          cp .env.example .env
          docker-compose up -d
          sleep 10

      - name: Check service health
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost/health 2>/dev/null; then
              echo "✓ API is healthy"
              break
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "✗ API health check failed"
            docker-compose logs
            exit 1
          fi

      - name: Check database connectivity
        run: docker-compose exec -T postgres pg_isready -U photobank

      - name: View logs
        if: failure()
        run: docker-compose logs
