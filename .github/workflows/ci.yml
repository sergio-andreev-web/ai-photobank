name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: photobank_test
          POSTGRES_USER: photobank
          POSTGRES_PASSWORD: photobank_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          cp .env.example .env
          sed -i 's/localhost/127.0.0.1/g' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=photobank_test/' .env

      - name: Validate Contracts
        run: |
          cd contracts
          python3 -m pip install -q -r requirements-validation.txt
          python3 tools/validate_contracts.py

      # QA contract guard (docs/qa/integration-qa.md): accepted operations,
      # strict AI analysis schema, search rules, Nuxt API paths. Uses PyYAML/
      # jsonschema installed by the step above.
      - name: Contract guard tests (tests/contracts)
        run: python3 -m unittest discover -s tests/contracts -v

      - name: Orchestrator tests (tests/orchestrator)
        run: python3 -m unittest discover -s tests/orchestrator -v

  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint < apps/api/Dockerfile || true
          docker run --rm -i hadolint/hadolint < apps/admin/Dockerfile || true
          docker run --rm -i hadolint/hadolint < services/ai/Dockerfile || true
        continue-on-error: true

      # Overlays are only valid on top of the base file, so validate the same
      # combinations the Makefile and docs use.
      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.mac.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config -q

  backend-tests-sqlite:
    name: Backend Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo, pdo_pgsql, pdo_sqlite, sockets, sqlite3, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit (SQLite, per phpunit.xml)
        working-directory: apps/api
        run: vendor/bin/phpunit

      # QA-owned HTTP-to-queue §75 acceptance with FakeAiClient. It lives in
      # tests/e2e (outside apps/api/tests), so phpunit.xml's suites don't pick
      # it up; run it explicitly with the same config.
      - name: MVP acceptance (tests/e2e/MvpAcceptanceTest.php, SQLite)
        working-directory: apps/api
        run: vendor/bin/phpunit -c phpunit.xml ../../tests/e2e/MvpAcceptanceTest.php

  backend-tests-pgsql:
    name: Backend Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: photobank_test
          POSTGRES_USER: photobank
          POSTGRES_PASSWORD: photobank_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo, pdo_pgsql, pdo_sqlite, sockets, sqlite3, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      # phpunit.xml pins DB_CONNECTION=sqlite for local runs, but its <env>
      # entries have no force="true", so PHPUnit keeps variables already set
      # in the environment — the step env below retargets the suite at the
      # pgvector service container.
      - name: Run PHPUnit (PostgreSQL)
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: photobank_test
          DB_USERNAME: photobank
          DB_PASSWORD: photobank_test
        run: vendor/bin/phpunit

  ai-tests:
    name: AI Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/ai
        run: pip install -r requirements-dev.txt

      # Model-backed integration tests are opt-in (pytest.ini addopts already
      # defaults to "-m not model"); pass it explicitly so CI never depends on
      # GPU/network model weights (ТЗ §73).
      - name: Run pytest
        working-directory: services/ai
        run: pytest -m "not model"

  admin-tests:
    name: Admin Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Run unit tests (Vitest)
        working-directory: apps/admin
        run: npx vitest run

      - name: Build (Nuxt)
        working-directory: apps/admin
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/admin/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: apps/admin
        run: npx playwright install --with-deps chromium

      # e2e specs mock the API via Playwright route interception (tests/e2e/helpers.ts),
      # so no backend/AI service is started here.
      - name: Run e2e tests (Playwright, chromium)
        working-directory: apps/admin
        run: npx playwright test --project=chromium

  # ТЗ §75 acceptance proof, informational/non-blocking for now (gating is the
  # coordinator's call): on a fresh runner and clean checkout, literally
  # `make setup` (§66), then the browser e2e in tests/e2e/stack against nginx
  # — real Nuxt, Laravel, worker, PostgreSQL/pgvector and the mock AI (ai-cpu).
  acceptance:
    name: "§75 Acceptance: make setup + browser e2e (informational)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Built up front so a build failure is its own step; `make setup` then
      # finds the images and only creates containers.
      - name: Build images
        run: docker compose --profile ai build

      - name: make setup
        run: make setup

      # make setup already waits on the healthchecks (--wait); this states the
      # expectations explicitly and checks the edge from the host.
      - name: Check stack health
        run: |
          for service in postgres redis rabbitmq api admin nginx ai-cpu; do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose --profile ai ps -q "$service")")"
            echo "$service: $status"
            test "$status" = healthy
          done
          # The worker serves no HTTP and has no healthcheck: it must simply be running.
          test "$(docker compose ps api-worker --format '{{.State}}')" = running
          curl -fsS http://localhost/health
          curl -fsS -o /dev/null http://localhost/login
          curl -fsS http://localhost:8001/ready

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/stack/package-lock.json

      - name: Install e2e dependencies
        working-directory: tests/e2e/stack
        run: npm ci

      - name: Type-check e2e specs
        working-directory: tests/e2e/stack
        run: npx tsc --noEmit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/stack/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: tests/e2e/stack
        run: npx playwright install --with-deps chromium

      # unit (PNG generator) + acceptance (§75) + ai-outage (§46: stops and
      # restarts ai-cpu through docker compose from the test).
      - name: Run §75 acceptance e2e
        working-directory: tests/e2e/stack
        env:
          E2E_AI_OUTAGE: '1'
        run: npx playwright test

      - name: Collect stack logs
        if: failure()
        run: |
          mkdir -p stack-logs
          docker compose --profile ai ps -a > stack-logs/ps.txt 2>&1 || true
          docker compose --profile ai logs --no-color --timestamps > stack-logs/compose.log 2>&1 || true
          # Laravel logs to storage/logs (not stdout) in this image.
          docker compose exec -T api sh -c 'cat storage/logs/*.log' > stack-logs/laravel.log 2>&1 || true

      - name: Upload e2e report and stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: section-75-acceptance
          path: |
            tests/e2e/stack/playwright-report/
            tests/e2e/stack/test-results/
            stack-logs/
          retention-days: 14
          if-no-files-found: ignore
