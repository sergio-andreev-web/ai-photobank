name: CI

on:
  push:
    branches: [ main, agent/** ]
  pull_request:
    branches: [ main ]

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17-v0.8.0
        env:
          POSTGRES_DB: photobank_test
          POSTGRES_USER: photobank
          POSTGRES_PASSWORD: photobank_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          cp .env.example .env
          sed -i 's/localhost/127.0.0.1/g' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=photobank_test/' .env

      - name: Validate Contracts
        run: |
          cd contracts
          python3 -m pip install -q -r requirements-validation.txt
          python3 tools/validate_contracts.py

  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint < apps/api/Dockerfile || true
          docker run --rm -i hadolint/hadolint < apps/admin/Dockerfile || true
          docker run --rm -i hadolint/hadolint < services/ai/Dockerfile || true
        continue-on-error: true

      - name: Validate YAML
        run: |
          for file in docker-compose*.yml; do
            docker-compose -f "$file" config > /dev/null || exit 1
          done
        continue-on-error: true

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker-compose build --no-cache
        continue-on-error: true

      - name: Start services
        run: |
          cp .env.example .env
          docker-compose up -d
          sleep 10
        continue-on-error: true

      - name: Check service health
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost/health 2>/dev/null; then
              echo "✓ API is healthy"
              break
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "✗ API health check failed"
            docker-compose logs
            exit 1
          fi
        continue-on-error: true

      - name: Check database connectivity
        run: |
          docker-compose exec -T postgres pg_isready -U photobank || exit 1
        continue-on-error: true

      - name: View logs
        if: failure()
        run: docker-compose logs
