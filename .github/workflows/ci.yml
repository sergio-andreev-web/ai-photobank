name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: photobank_test
          POSTGRES_USER: photobank
          POSTGRES_PASSWORD: photobank_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          cp .env.example .env
          sed -i 's/localhost/127.0.0.1/g' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=photobank_test/' .env

      - name: Validate Contracts
        run: |
          cd contracts
          python3 -m pip install -q -r requirements-validation.txt
          python3 tools/validate_contracts.py

  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint < apps/api/Dockerfile || true
          docker run --rm -i hadolint/hadolint < apps/admin/Dockerfile || true
          docker run --rm -i hadolint/hadolint < services/ai/Dockerfile || true
        continue-on-error: true

      # Overlays are only valid on top of the base file, so validate the same
      # combinations the Makefile and docs use.
      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.mac.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config -q

  backend-tests-sqlite:
    name: Backend Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo, pdo_pgsql, pdo_sqlite, sockets, sqlite3, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit (SQLite, per phpunit.xml)
        working-directory: apps/api
        run: vendor/bin/phpunit

  backend-tests-pgsql:
    name: Backend Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: photobank_test
          POSTGRES_USER: photobank
          POSTGRES_PASSWORD: photobank_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, pdo, pdo_pgsql, pdo_sqlite, sockets, sqlite3, xml, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      # phpunit.xml pins DB_CONNECTION=sqlite for local runs, but its <env>
      # entries have no force="true", so PHPUnit keeps variables already set
      # in the environment — the step env below retargets the suite at the
      # pgvector service container.
      - name: Run PHPUnit (PostgreSQL)
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: photobank_test
          DB_USERNAME: photobank
          DB_PASSWORD: photobank_test
        run: vendor/bin/phpunit

  ai-tests:
    name: AI Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/ai
        run: pip install -r requirements-dev.txt

      # Model-backed integration tests are opt-in (pytest.ini addopts already
      # defaults to "-m not model"); pass it explicitly so CI never depends on
      # GPU/network model weights (ТЗ §73).
      - name: Run pytest
        working-directory: services/ai
        run: pytest -m "not model"

  admin-tests:
    name: Admin Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Run unit tests (Vitest)
        working-directory: apps/admin
        run: npx vitest run

      - name: Build (Nuxt)
        working-directory: apps/admin
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/admin/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: apps/admin
        run: npx playwright install --with-deps chromium

      # e2e specs mock the API via Playwright route interception (tests/e2e/helpers.ts),
      # so no backend/AI service is started here.
      - name: Run e2e tests (Playwright, chromium)
        working-directory: apps/admin
        run: npx playwright test --project=chromium

  # Full Compose stack smoke test, informational/non-blocking: the module test
  # jobs above are the enforced gate. Its steps are skipped until both
  # apps/api/Dockerfile and apps/admin/Dockerfile exist, so the job stays green
  # instead of reporting a red check on every run.
  integration:
    name: Integration Smoke (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Check service Dockerfiles
        id: dockerfiles
        run: |
          if [ -f apps/api/Dockerfile ] && [ -f apps/admin/Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/api/Dockerfile or apps/admin/Dockerfile is missing; skipping the stack smoke test"
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfiles.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build images
        if: steps.dockerfiles.outputs.present == 'true'
        run: docker compose build --no-cache

      # `--wait` blocks until every started service's own healthcheck
      # reports healthy (postgres/redis/rabbitmq, api's `curl .../up`,
      # admin's `curl :3000`, nginx's `wget .../health`) or the timeout
      # elapses, instead of a fixed sleep — nginx's `depends_on: condition:
      # service_healthy` on api/admin means it won't even start listening
      # until those are healthy, so this also validates that chain.
      - name: Start services
        if: steps.dockerfiles.outputs.present == 'true'
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=$|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          # Same order as `make setup`: dependencies and api, migrations, then the rest.
          docker compose up -d --wait --wait-timeout 180 postgres redis rabbitmq api
          docker compose exec -T api php artisan migrate --force
          docker compose up -d --wait --wait-timeout 180

      # nginx's own /health is a static stub (always 200 once nginx is up);
      # api/admin health is already verified by `--wait` above via their own
      # healthchecks. This just confirms the edge is reachable from the host
      # on the upstream ports nginx's conf.d expects (api:8000, admin:3000
      # internally) and proxies through to the admin UI at `/`.
      - name: Check nginx edge health
        if: steps.dockerfiles.outputs.present == 'true'
        run: |
          curl -f http://localhost/health
          curl -f http://localhost/ > /dev/null

      - name: Check database connectivity
        if: steps.dockerfiles.outputs.present == 'true'
        run: docker compose exec -T postgres pg_isready -U photobank

      - name: View logs
        if: failure() && steps.dockerfiles.outputs.present == 'true'
        run: docker compose logs
