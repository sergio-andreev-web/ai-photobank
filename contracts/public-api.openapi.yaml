openapi: 3.1.0
info:
  title: AI Photobank — Public API
  version: 1.2.0
  summary: Публичный HTTP API Laravel — единственный источник данных для Nuxt.
  description: |
    Статус: **утвержден, версия 1.0.0** (см. contracts/README.md).

    Nuxt обращается только к этому API (§10, §70 Agent B). Frontend не читает БД,
    файловую систему и AI service, не повторяет логику TagResolver.

    Маркировка:
    - `x-tz` — операция или поле взяты из ТЗ (номер раздела);
    - `x-adr` — ссылка на утвержденное архитектурное решение.

    Общие правила (утверждено, ADR-0002):
    - JSON в UTF-8; даты — RFC 3339 в UTC (`2026-09-25T13:43:55Z`); ID — int64.
    - Один ресурс возвращается как объект без обертки (как в примерах §26, §49).
    - Коллекции: `{ "data": [...], "meta": { page, per_page, total, last_page } }`.
    - Клиент игнорирует неизвестные поля ответа; добавление поля — minor-изменение.
    - Все ошибки — `{ "error": { code, message, details, trace_id } }` (§51). Логика клиента строится
      только на `error.code` и HTTP-статусе; неизвестный код обрабатывается как общая ошибка.
    - Каждый ответ содержит заголовок `X-Request-ID`, равный `error.trace_id` для ошибок (§64).
  x-contract-status: accepted
servers:
  - url: /
    description: |
      Same-origin за nginx: Nuxt и Laravel (`/api`, `/sanctum`) под одним origin, поэтому CORS не нужен
      (утверждено, ADR-0001).
tags:
  - name: auth
  - name: dashboard
  - name: batches
  - name: images
  - name: image-tags
  - name: tags
  - name: aliases
  - name: tag-candidates
  - name: search
  - name: media
security:
  - sessionCookie: []
paths:
  /sanctum/csrf-cookie:
    get:
      tags: [auth]
      operationId: getCsrfCookie
      summary: Получить XSRF-TOKEN cookie перед login
      description: |
        Стандартный маршрут Laravel Sanctum SPA. Устанавливает cookie `XSRF-TOKEN`; клиент передает его значение
        в заголовке `X-XSRF-TOKEN` во всех изменяющих запросах (POST/PATCH/DELETE).
      x-adr: ADR-0001
      security: []
      responses:
        '204':
          description: Cookie установлена.
          headers:
            Set-Cookie:
              description: XSRF-TOKEN=...; Path=/; SameSite=Lax
              schema:
                type: string
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход администратора
      x-tz: "§50"
      description: |
        Создает серверную сессию (cookie-сессия Sanctum SPA, утверждено ADR-0001). Регенерирует ID сессии.
        Пользователь с ролью, отличной от admin, получает 403 `FORBIDDEN`.
      security:
        - xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                value:
                  email: admin@example.com
                  password: secret-password
      responses:
        '200':
          description: Вход выполнен; установлена cookie сессии.
          headers:
            Set-Cookie:
              description: Cookie сессии Laravel (HttpOnly; SameSite=Lax; Secure в production).
              schema:
                type: string
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                admin:
                  $ref: '#/components/examples/UserAdmin'
        '403':
          $ref: '#/components/responses/Forbidden'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          description: Неверные учетные данные (`INVALID_CREDENTIALS`) или невалидное тело (`VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: Invalid email or password
                      details: {}
                      trace_id: 7d1c2e3f-0a4b-4c5d-8e6f-1a2b3c4d5e6f
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выход
      x-tz: "§50"
      description: Инвалидирует сессию и XSRF-токен. Идемпотентен — без сессии тоже 204 (утверждено, ADR-0001).
      security:
        - xsrfToken: []
      responses:
        '204':
          description: Сессия завершена.
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Текущий пользователь
      x-tz: "§50"
      responses:
        '200':
          description: Пользователь текущей сессии.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                admin:
                  $ref: '#/components/examples/UserAdmin'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/admin/dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Счетчики для экрана Dashboard
      description: |
        Экран Dashboard обязателен (§52), endpoint в §50 не назван. Предлагается отдельный endpoint
        вместо пяти запросов к спискам (ADR-0003).
      x-tz: "§52"
      x-adr: ADR-0003
      responses:
        '200':
          description: Счетчики.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
              examples:
                sample:
                  value:
                    images_count: 1240
                    tags_count: 318
                    pending_candidates_count: 27
                    processing_images_count: 12
                    failed_images_count: 3
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/batches:
    get:
      tags: [batches]
      operationId: listBatches
      summary: Список batch-загрузок
      x-tz: "§50"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          required: false
          description: Фильтр по статусу (утверждено).
          schema:
            $ref: './schemas/enums.json#/$defs/BatchStatus'
        - name: sort
          in: query
          required: false
          x-adr: ADR-0002
          schema:
            type: string
            enum: ['-created_at', created_at]
            default: '-created_at'
      responses:
        '200':
          description: Страница batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [batches]
      operationId: createBatch
      summary: Создать batch
      x-tz: "§26"
      description: Первый шаг загрузки (§26). Новый batch имеет статус `created` и нулевой progress.
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
            examples:
              named:
                value:
                  name: Буровая площадка, сентябрь 2026
      responses:
        '201':
          description: Batch создан. Ответ — надмножество примера §26 (`id`, `status`).
          headers:
            Location:
              schema:
                type: string
              description: /api/admin/batches/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              examples:
                created:
                  value:
                    id: 42
                    name: Буровая площадка, сентябрь 2026
                    status: created
                    progress:
                      total: 0
                      processed: 0
                      failed: 0
                    created_at: '2026-09-25T13:43:55Z'
                    updated_at: '2026-09-25T13:43:55Z'
                    completed_at: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/batches/{batch}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [batches]
      operationId: getBatch
      summary: Состояние и progress batch (polling)
      x-tz: "§49"
      description: |
        Frontend опрашивает примерно раз в 2 секунды (§49), WebSockets не используются.
        Правила счетчиков `progress` — утверждено (ADR-0005, contracts/state-machines.md).
      responses:
        '200':
          description: Batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              examples:
                processing:
                  $ref: '#/components/examples/BatchProcessing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BatchNotFound'
  /api/admin/batches/{batch}/images:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    post:
      tags: [batches]
      operationId: uploadBatchImage
      summary: Загрузить один файл в batch
      x-tz: "§26, §27, §81"
      description: |
        Один файл на запрос (§26); frontend может грузить параллельно 3–5 файлов.
        Ответ приходит после сохранения оригинала и постановки обработки в очередь; AI не ожидается (§81).
        Content-based MIME-проверка, санитизация имени, случайное имя хранения (§63).
        Дубликат по SHA-256 не сохраняется: 409 `IMAGE_ALREADY_EXISTS` с `details.existing_image_id` (§27);
        frontend показывает файл как skipped duplicate.
        Имя поля формы, допустимые типы, лимит размера и код 201 — утверждено (ADR-0005).
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [image]
              properties:
                image:
                  type: string
                  contentMediaType: application/octet-stream
                  description: |
                    Файл изображения. Имя поля `image` — утверждено. Допустимые типы по содержимому (утверждено):
                    image/jpeg, image/png, image/webp. Лимит размера настраивается (§63), значение по умолчанию —
                    вопрос ADR-0005.
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Файл сохранен; обработка поставлена в очередь. Статус изображения `uploaded` или `queued`.
          x-adr: ADR-0005
          headers:
            Location:
              schema:
                type: string
              description: /api/admin/images/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSummary'
              examples:
                uploaded:
                  $ref: '#/components/examples/ImageUploaded'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BatchNotFound'
        '409':
          description: |
            `IMAGE_ALREADY_EXISTS` — файл с тем же SHA-256 уже есть (§27; HTTP 409 — утверждено);
            `BATCH_NOT_ACCEPTING_UPLOADS` — batch уже завершен (утверждено).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate:
                  $ref: '#/components/examples/ErrorImageAlreadyExists'
                batchClosed:
                  value:
                    error:
                      code: BATCH_NOT_ACCEPTING_UPLOADS
                      message: Batch is not accepting uploads
                      details:
                        status: completed
                      trace_id: 7d1c2e3f-0a4b-4c5d-8e6f-1a2b3c4d5e6f
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/batches/{batch}/complete:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    post:
      tags: [batches]
      operationId: completeBatch
      summary: Сообщить, что все файлы batch отправлены
      x-tz: "§26"
      description: |
        Идемпотентен (§26): повторный вызов возвращает текущее состояние без изменений.
        Переводит batch в `processing` или сразу в финальный статус, если все изображения уже обработаны
        (утверждено, ADR-0005). После complete новые файлы не принимаются.
      security:
        - sessionCookie: []
          xsrfToken: []
      responses:
        '200':
          description: Текущее состояние batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              examples:
                processing:
                  $ref: '#/components/examples/BatchProcessing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BatchNotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
  /api/admin/images:
    get:
      tags: [images]
      operationId: listImages
      summary: Библиотека изображений
      x-tz: "§50, §53"
      description: |
        Фильтры §53: tags, status, batch, date. Параметры фильтров и сортировки — утверждено (ADR-0002).
        Удаленные (soft delete) изображения не возвращаются.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          required: false
          schema:
            $ref: './schemas/enums.json#/$defs/ImageStatus'
        - name: batch_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/TagIdsFilter'
        - name: created_from
          in: query
          required: false
          description: Включительно, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          required: false
          description: Не включительно, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          x-adr: ADR-0002
          schema:
            type: string
            enum: ['-created_at', created_at]
            default: '-created_at'
      responses:
        '200':
          description: Страница изображений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/images/{image}:
    parameters:
      - $ref: '#/components/parameters/ImageId'
    get:
      tags: [images]
      operationId: getImage
      summary: Карточка изображения
      x-tz: "§50, §54"
      responses:
        '200':
          description: Изображение с тегами, последним анализом и состоянием обработки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDetail'
              examples:
                ready:
                  $ref: '#/components/examples/ImageDetailReady'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ImageNotFound'
    patch:
      tags: [images]
      operationId: updateImage
      summary: Изменить редактируемые поля изображения
      x-tz: "§50"
      description: |
        ТЗ не определяет редактируемые поля. Предложение: только отображаемое имя `original_name`.
        Caption/OCR не редактируются, так как reprocess их перезаписывает (§76). Теги меняются через
        /tags (§41). Открытый вопрос ADR-0006.
      x-adr: ADR-0006
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagePatchRequest'
      responses:
        '200':
          description: Обновленное изображение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [images]
      operationId: deleteImage
      summary: Удалить изображение (soft delete)
      x-tz: "§50, §78"
      description: |
        Soft delete (§78). Файлы и история анализов не удаляются в MVP (утверждено). Повторный DELETE → 404.
        Удаленное изображение исключается из списков, поиска, media и счетчиков.
      security:
        - sessionCookie: []
          xsrfToken: []
      responses:
        '204':
          description: Удалено.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
  /api/admin/images/{image}/reprocess:
    parameters:
      - $ref: '#/components/parameters/ImageId'
    post:
      tags: [images]
      operationId: reprocessImage
      summary: Повторный AI-анализ
      x-tz: "§50, §76"
      description: |
        Не удаляет manual tags, suppressions и оригинал; может обновить caption, OCR, AI concepts, AI tags,
        embedding и создает новую запись image_analyses, не удаляя старые (§76).
        Если изображение уже `queued`/`processing`, новая задача не создается и возвращается 202 с текущим
        состоянием (утверждено, ADR-0003).
      security:
        - sessionCookie: []
          xsrfToken: []
      responses:
        '202':
          description: Анализ поставлен в очередь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
  /api/admin/images/{image}/retry:
    parameters:
      - $ref: '#/components/parameters/ImageId'
    post:
      tags: [images]
      operationId: retryImage
      summary: Повторить упавшую обработку
      description: |
        Кнопка Retry после исчерпания попыток (§3, §47) в §50 не названа. Предложение (ADR-0003):
        доступно только для `status=failed`; перезапускает обработку с первой упавшей задачи
        processing_tasks со сбросом attempts. Иначе 409 `IMAGE_NOT_RETRYABLE`.
      x-tz: "§3, §47"
      x-adr: ADR-0003
      security:
        - sessionCookie: []
          xsrfToken: []
      responses:
        '202':
          description: Обработка поставлена в очередь, статус `queued`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '409':
          description: '`IMAGE_NOT_RETRYABLE` — изображение не в статусе failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFailed:
                  value:
                    error:
                      code: IMAGE_NOT_RETRYABLE
                      message: Only failed images can be retried
                      details:
                        status: ready
                      trace_id: 7d1c2e3f-0a4b-4c5d-8e6f-1a2b3c4d5e6f
        '419':
          $ref: '#/components/responses/CsrfTokenMismatch'
  /api/admin/images/{image}/tags:
    parameters:
      - $ref: '#/components/parameters/ImageId'
    post:
      tags: [image-tags]
      operationId: addImageTag
      summary: Вручную добавить тег
      x-tz: "§41"
      description: |
        Создает или переводит связь в `source=manual`, `locked=true` (§41). Существующая AI-связь
        с тем же тегом становится manual. Suppression этого тега для изображения снимается (утверждено, ADR-0006).
        Повторное добавление уже manual тега — 200 без изменений (утверждено). Архивный тег → 409 `TAG_ARCHIVED`.
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageTagCreateRequest'
            examples:
              add:
                value:
                  tag_id: 14
      responses:
        '200':
          description: Связь уже была manual; изменений нет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageTag'
        '201':
          description: Связь создана или переведена в manual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageTag'
              examples:
                manual:
                  value:
                    tag:
                      id: 14
                      name: Каска
                      type: object
                      status: active
                    source: manual
                    confidence: null
                    locked: true
                    created_at: '2026-09-25T14:00:00Z'
                    updated_at: '2026-09-25T14:00:00Z'
        '401':
