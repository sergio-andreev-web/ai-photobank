components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Laravel Sanctum SPA cookie-сессия (утверждено, ADR-0001). Имя cookie задается SESSION_COOKIE;
        клиент не читает ее значение (HttpOnly) и только отправляет с `credentials: include`.
        Без сессии → 401 `UNAUTHENTICATED`; роль не admin → 403 `FORBIDDEN`.
      x-adr: ADR-0001
    xsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        Значение cookie `XSRF-TOKEN` (URL-decoded), обязательно для POST/PATCH/DELETE.
        Неверный/просроченный токен → 419 `CSRF_TOKEN_MISMATCH`; клиент повторно вызывает /sanctum/csrf-cookie.
      x-adr: ADR-0001
  headers:
    RequestId:
      description: ID запроса (trace_id), совпадает с error.trace_id в ошибках (утверждено, ADR-0002).
      schema:
        type: string
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы с 1. Страница за пределами — пустой data, не ошибка (утверждено).
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      x-adr: ADR-0002
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    BatchId:
      name: batch
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ImageId:
      name: image
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TagId:
      name: tag
      in: path
      required: true
      description: ID тега.
      schema:
        type: integer
        format: int64
        minimum: 1
    CandidateId:
      name: candidate
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TagIdsFilter:
      name: tag_ids[]
      in: query
      required: false
      description: Изображение должно иметь все указанные теги (AND, утверждено ADR-0004). Формат Laravel `tag_ids[]=1&tag_ids[]=2`.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        uniqueItems: true
        items:
          type: integer
          format: int64
          minimum: 1
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
    DateTime:
      type: string
      format: date-time
    ErrorCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]*$'
      description: |
        Стабильный машиночитаемый код (§51). Каталог и HTTP-статусы — в contracts/README.md.
        Из ТЗ: IMAGE_NOT_FOUND, IMAGE_ALREADY_EXISTS, AI_SERVICE_UNAVAILABLE. Остальные — утверждено.
        Клиент обязан обрабатывать неизвестный код как общую ошибку.
      examples: [IMAGE_NOT_FOUND]
    ErrorResponse:
      $ref: './schemas/error-response.json'
      x-tz: "§51"
      x-adr: "ADR-0002"
    PaginationMeta:
      type: object
      required: [page, per_page, total, last_page]
      x-adr: ADR-0002
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
          description: 1 при total = 0.
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: './schemas/enums.json#/$defs/UserRole'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 255
    Dashboard:
      type: object
      required: [images_count, tags_count, pending_candidates_count, processing_images_count, failed_images_count]
      x-tz: "§52"
      x-adr: ADR-0003
      properties:
        images_count:
          type: integer
          minimum: 0
          description: Все не удаленные изображения.
        tags_count:
          type: integer
          minimum: 0
          description: Теги со статусом active.
        pending_candidates_count:
          type: integer
          minimum: 0
        processing_images_count:
          type: integer
          minimum: 0
          description: Изображения в статусах uploaded, queued, processing.
        failed_images_count:
          type: integer
          minimum: 0
    BatchProgress:
      type: object
      required: [total, processed, failed]
      x-tz: "§49"
      description: |
        Правила (утверждено, ADR-0005): total — число сохраненных изображений batch (дубликаты не считаются);
        processed — изображения в финальном статусе (ready или failed); failed — изображения в статусе failed.
        Инвариант: 0 ≤ failed ≤ processed ≤ total.
      properties:
        total:
          type: integer
          minimum: 0
        processed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
